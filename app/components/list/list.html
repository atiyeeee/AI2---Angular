<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="text-pink" style="color:#ff1493;">Lista osób</h2>
    <button routerLink="/add" class="btn btn-pink text-white" style="background-color:#ff69b4;">Dodaj nową osobę</button>
  </div>

  <div *ngIf="persons.length === 0" class="alert alert-warning">
    Brak zapisanych osób.
  </div>

  <ul class="list-group">
    <li *ngFor="let p of persons; let i = index" class="list-group-item d-flex justify-content-between align-items-center mb-2" style="background:#fff0f6; border-radius:8px;">
      <div>
        <strong>{{p.firstName}} {{p.familyName}}</strong>
        — {{p.age}} lat —
        {{p.address?.city}}, {{p.address?.street}} ({{p.address?.postCode}})
      </div>
      <div>
        <button (click)="goToDetails(i)" class="btn btn-outline-primary btn-sm me-1">Szczegóły</button>
        <button (click)="delete(i)" class="btn btn-outline-danger btn-sm">Usuń</button>
      </div>
    </li>
  </ul>
</div>
