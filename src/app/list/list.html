<div class="list-card">
  <h4>Lista</h4>

  <div class="form">
    <input [(ngModel)]="newItem" placeholder="Wpisz tekst..." />
    <button (click)="add()">Dodaj</button>
  </div>

  <ul>
    <li *ngFor="let item of items; let i = index">
      {{ item }} <a href="#" (click)="remove(i); $event.preventDefault()">usuń</a>
    </li>
  </ul>
</div>
